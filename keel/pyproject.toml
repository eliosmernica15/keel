[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-harness"
version = "0.1.1"
description = "Keel — independent agentic coding harness (clean-room reimplementation of the observable CLI experience). Phase 0/1 scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["tzdata>=2024.1", "cryptography>=42.0", "keyring>=24.0", "Pillow>=10.0"]

[project.scripts]
keel = "keel.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", "release", "unused", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/keel"]
