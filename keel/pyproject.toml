[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-harness"
version = "0.1.0"
description = "Keel — independent agentic coding harness (clean-room reimplementation of the observable CLI experience). Phase 0/1 scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["tzdata>=2024.1"]

[project.scripts]
keel = "keel.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
