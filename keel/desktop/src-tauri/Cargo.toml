[package]
name = "keel-desktop"
version = "0.1.1"
description = "Keel desktop shell for the keel agentic coding harness"
edition = "2021"
rust-version = "1.70"
license = "Proprietary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
