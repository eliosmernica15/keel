<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { margin-bottom: 10px; letter-spacing: 4px; color: #4ecca3; }
  #hud {
    display: flex;
    gap: 30px;
    margin-bottom: 10px;
    font-size: 18px;
  }
  #hud span { color: #4ecca3; font-weight: bold; }
  canvas {
    background: #16213e;
    border: 3px solid #4ecca3;
    border-radius: 6px;
    box-shadow: 0 0 25px rgba(78, 204, 163, 0.35);
  }
  #msg {
    margin-top: 12px;
    font-size: 16px;
    color: #ffd369;
    min-height: 22px;
  }
  button {
    margin-top: 10px;
    padding: 8px 22px;
    font-size: 15px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #3bb389; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="msg">Use arrow keys or WASD to move. Press Space to pause.</div>
  <button id="restart">Restart</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');
const restartBtn = document.getElementById('restart');

const GRID = 20;
const CELL = canvas.width / GRID;

let snake, dir, nextDir, food, score, best = 0, alive, paused, loop;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  alive = true;
  paused = false;
  scoreEl.textContent = score;
  msgEl.textContent = 'Use arrow keys or WASD to move. Press Space to pause.';
  placeFood();
  clearInterval(loop);
  loop = setInterval(tick, 110);
}

function placeFood() {
  while (true) {
    food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
  }
}

function tick() {
  if (!alive || paused) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    msgEl.textContent = 'Game Over! Score: ' + score + ' — press Restart or Space.';
    draw();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // grid dots
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let x = 0; x < GRID; x++)
    for (let y = 0; y < GRID; y++)
      ctx.fillRect(x * CELL + CELL/2 - 1, y * CELL + CELL/2 - 1, 2, 2);

  // food
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ecca3' : '#3aa981';
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad*2, CELL - pad*2);
  });

  if (paused && alive) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd369';
    ctx.font = 'bold 28px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
  }
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = {
    arrowup: {x:0,y:-1}, w: {x:0,y:-1},
    arrowdown: {x:0,y:1}, s: {x:0,y:1},
    arrowleft: {x:-1,y:0}, a: {x:-1,y:0},
    arrowright: {x:1,y:0}, d: {x:1,y:0}
  };
  if (map[k]) {
    e.preventDefault();
    const nd = map[k];
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  } else if (k === ' ') {
    e.preventDefault();
    if (!alive) { reset(); return; }
    paused = !paused;
    msgEl.textContent = paused ? 'Paused. Press Space to resume.' : 'Use arrow keys or WASD to move.';
    draw();
  }
});

restartBtn.addEventListener('click', reset);
reset();
</script>
</body>
</html>
