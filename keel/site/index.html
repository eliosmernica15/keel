<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel — your agentic coding harness, on your machine</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0605">
<meta name="description" content="Keel is the local, private desktop coding surface — a real agent, your files, your keys, on your machine. Open source, no cloud relay.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/ui/icons/icon-192.png">
<link rel="apple-touch-icon" href="/ui/icons/icon-192.png">

<link rel="preconnect" href="" crossorigin>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('/ui/fonts/inter-400.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;
  src:url('/ui/fonts/space-grotesk-400.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;
  src:url('/ui/fonts/jetbrains-mono-400.woff2') format('woff2');}

:root{
  --outer:#0a0605;
  --win: rgba(12, 10, 9, .5);
  --side: rgba(22, 15, 10, .45);
  --line: rgba(255,255,255,.08);
  --edge: rgba(255,255,255,.11);
  --text: #f2f0ea;
  --muted: #8a8279;
  --hover: rgba(255,255,255,.05);
  --accent: #e6d54c;
  --card: rgba(255,255,255,.045);
  --cardb: rgba(255,255,255,.075);
  --shadow: 0 40px 90px -24px #000;
  --glow: 0 0 90px rgba(230,213,76,.06);
  --ok:#6fe3b0; --warn:#e6d54c; --danger:#f09a86; --info:#8ab4ff;
  --o1:radial-gradient(circle,#c4561a 0%,rgba(196,86,26,0) 68%);
  --o2:radial-gradient(circle,#9a7a12 0%,rgba(154,122,18,0) 68%);
  --o3:radial-gradient(circle,#7a2e12 0%,rgba(122,46,18,0) 68%);
  --serif:'Space Grotesk',Inter,sans-serif;
  --sans:Inter,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background: radial-gradient(70% 55% at 0% 0%,#8c3f0e 0%,rgba(140,63,14,0) 70%),
              radial-gradient(60% 50% at 100% 100%,#3b1d09 0%,rgba(59,29,9,0) 70%),
              var(--outer);
  color:var(--text);font-family:var(--sans);font-size:14.5px;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before,body::after{
  content:"";position:fixed;z-index:0;border-radius:50%;pointer-events:none;filter:blur(60px);
  animation:orbDrift 24s ease-in-out infinite alternate;
}
body::before{width:50vmax;height:50vmax;left:-12vmax;top:-14vmax;background:var(--o1)}
body::after{width:46vmax;height:46vmax;right:-12vmax;bottom:-16vmax;background:var(--o2);animation-delay:-9s}
@keyframes orbDrift{to{transform:translate(9vmax,7vmax) scale(1.18)}}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.app{display:flex;height:100%;position:relative;z-index:1}

/* ---------- sidebar ---------- */
.side{
  width:236px;flex:none;
  background:var(--side); border-right:1px solid var(--edge);
  display:flex;flex-direction:column;position:relative;z-index:2;
  -webkit-backdrop-filter:blur(32px) saturate(1.5); backdrop-filter:blur(32px) saturate(1.5);
}
.side::after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:1px;background:var(--edge)}

.tools{height:34px;display:flex;align-items:center;padding:0 14px;gap:0;position:absolute;top:0;left:0;z-index:5;right:0}
.tools > button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.tools > button:hover{background:var(--hover)}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:2px;margin-left:8px;gap:0;border:1px solid var(--edge)}
.seg button{width:34px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--muted)}
.seg button.on{background:var(--cardb);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.4)}

nav{margin-top:44px;padding:0 10px}
nav a{display:flex;align-items:center;gap:10px;height:28px;padding:0 11px;border-radius:7px;color:var(--text);text-decoration:none;margin-bottom:1px;cursor:pointer}
nav a:hover,nav a.on{background:var(--hover)}
nav a svg{width:15px;height:15px;stroke-width:1.5}

.recents{margin-top:30px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11.5px;height:22px}
.recents span:last-child{display:flex;gap:10px}
.recents button{display:grid;place-items:center;color:var(--muted)}
.recents button:hover{color:var(--text)}

.list{margin-top:10px;padding:0 10px}
.list a{display:block;height:30px;line-height:30px;padding:0 11px;font-size:12.5px;border-radius:7px;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list a:hover{background:var(--hover)}
.list{position:relative}
.list::after{
  content:"";position:absolute;left:11px;right:11px;bottom:-14px;height:24px;pointer-events:none;
  background:linear-gradient(rgba(22,15,10,0) 0%,rgba(22,15,10,1) 100%);border-radius:0 0 8px 8px;
}

.acct{margin-top:auto;height:44px;border-top:1px solid var(--edge);display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer}
.acct:hover{background:var(--hover)}
.acct .logo{width:22px;height:22px;stroke:none;fill:none}
.acct b{font-weight:500}
.acct small{font-size:12px;color:var(--muted);margin-left:2px}
.acct svg:last-child{margin-left:auto;color:var(--muted)}

/* ---------- window controls ---------- */
.win{position:fixed;top:0;right:0;display:flex;z-index:5}
.win button{width:44px;height:34px;display:grid;place-items:center;color:var(--muted)}
.win button:hover{background:var(--hover);color:var(--text)}
.win svg{width:12px;height:12px;stroke-width:1.4}

/* ---------- main hero ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(40vh - 60px);overflow:auto;position:relative}
h1{
  display:flex;align-items:center;gap:14px;font-family:var(--serif);font-weight:400;
  font-size:42px;letter-spacing:-1.2px;line-height:1.1;color:var(--text);
}
h1 .starburst{width:44px;height:44px;stroke:none;fill:var(--accent);filter:drop-shadow(0 0 18px rgba(230,213,76,.35))}
h1 .wordmark{letter-spacing:-.8px}

.subtitle{
  margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#d6cfb5;
  text-transform:uppercase;
}
.tag{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  padding:4px 12px 4px 8px;border-radius:99px;border:1px solid rgba(230,213,76,.28);
  background:rgba(230,213,76,.06);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
}
.tag i{width:6px;height:6px;border-radius:99px;background:var(--ok);box-shadow:0 0 6px var(--ok)}

/* ---------- composer mock ---------- */
.composer{width:min(640px,calc(100% - 48px));margin-top:40px}
.box{
  position:relative;z-index:2;
  border:1px solid var(--edge);border-radius:22px;background:var(--cardb);
  box-shadow:0 10px 28px -14px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.04);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  padding:18px 18px 0;
}
.box:focus-within{border-color:rgba(230,213,76,.35);box-shadow:0 0 0 1px var(--edge), 0 0 40px rgba(230,213,76,.08)}
.box textarea{width:100%;height:44px;border:0;outline:0;resize:none;background:none;font:inherit;font-size:15px;color:var(--text);line-height:1.45;padding:0}
.box textarea::placeholder{color:var(--muted)}
.row{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:4px}
.row .add{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin-left:5px;color:var(--muted)}
.row .add:hover{background:var(--hover);color:var(--text)}
.row .add svg{width:18px;height:18px;stroke-width:1.5}
.model{margin-left:auto;color:var(--muted);font-size:12.5px;padding:5px 10px;border-radius:7px}
.model:hover{background:var(--hover)}
.send{
  width:32px;height:32px;margin-left:10px;display:grid;place-items:center;border-radius:9px;
  border:1px solid var(--edge);color:var(--muted);background:rgba(255,255,255,.04);
  transition:all .2s;
}
.send:hover{background:var(--accent);border-color:var(--accent);color:#171310}

.folder{
  position:relative;z-index:1;margin-top:-12px;height:51px;padding-top:24px;
  border:1px solid var(--edge);border-top:0;border-radius:0 0 18px 18px;
  display:flex;align-items:center;padding-left:22px;gap:8px;cursor:pointer;width:100%;
  font-size:14px;text-align:left;color:var(--text);
  background:rgba(255,255,255,.02);
}
.folder:hover{background:var(--hover)}
.folder svg{width:16px;height:16px;stroke-width:1.5}

/* ---------- ideas ---------- */
.ideas{width:min(640px,calc(100% - 48px));margin-top:34px;padding-left:22px;padding-bottom:40px}
.ideas p{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
.idea{display:flex;align-items:center;gap:16px;height:46px;font-size:13.5px;width:100%;text-align:left;border-radius:10px;padding:0 8px;color:var(--text)}
.idea:hover{background:var(--hover)}
.idea .ic{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:8px;color:var(--muted);background:var(--card)}
.idea .ic svg{width:16px;height:16px;stroke-width:1.4}

/* ---------- glass helper ---------- */
.glass{background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}

@media (max-width:760px){
  .side,.tools{display:none}
  .win{display:none}
  main{padding-top:20vh;font-size:14px}
  h1{font-size:30px;gap:10px}
  h1 .starburst{width:34px;height:34px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  body::before,body::after{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="starburst" viewBox="0 0 48 48">
      <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M24 2v12M24 34v12M2 24h12M34 24h12M7.5 7.5l9 9M31.5 31.5l9 9M40.5 7.5l-9 9M16.5 31.5l-9 9"/>
        <path d="M11 3.5l5.2 11.6M31.8 32.9l5.2 11.6M44.5 11l-11.6 5.2M21.4 32.9L9.8 44.5M37 3.5l-5.2 11.6M27.2 32.9l-5.2 11.6M44.5 37L32.9 31.8M21.4 15.2L9.8 3.6" stroke-width="1.8"/>
      </g>
      <circle cx="24" cy="24" r="4.4" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <aside class="side">
    <div class="tools">
      <button aria-label="Menu"><svg viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h11M2.5 8h7M2.5 11.5h11"/></svg></button>
      <button aria-label="Toggle sidebar"><svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button>
      <button aria-label="Back"><svg viewBox="0 0 16 16" fill="none"><path d="M13 8H3M7 4L3 8l4 4"/></svg></button>
      <button aria-label="Forward" disabled style="opacity:.35"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
      <div class="seg">
        <button class="on" aria-label="Chat"><svg viewBox="0 0 16 16" fill="none"><path d="M9.5 3.5h-5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h.5v2l2.5-2h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2z"/><path d="M11 6.5h1a2 2 0 0 1 2 2v2.5a2 2 0 0 1-2 2h-.5v1.5l-2-1.5"/></svg></button>
        <button aria-label="Code" disabled style="opacity:.35"><svg viewBox="0 0 16 16" fill="none"><path d="M5.5 5L2.5 8l3 3M10.5 5l3 3-3 3M9 4l-2 8"/></svg></button>
      </div>
    </div>

    <nav>
      <a class="on" id="new"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10"/></svg>New session</a>
      <a><svg viewBox="0 0 16 16" fill="none"><path d="M2.5 6.5h11v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1zM4 4.5h8M5 2.5h6"/></svg>Projects</a>
      <a><svg viewBox="0 0 16 16" fill="none"><circle cx="5.5" cy="4.5" r="1.8"/><path d="M2 13.5l2.5-5h2l2.5 5zM9.5 7.5h4v6h-4z"/></svg>Artifacts</a>
      <a><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8V8l2.2 1.4"/></svg>Scheduled</a>
      <a><svg viewBox="0 0 16 16" fill="none"><rect x="2" y="5.5" width="12" height="7.5" rx="1.3"/><path d="M5.8 5.5V4a1 1 0 0 1 1-1h2.4a1 1 0 0 1 1 1v1.5M2 8.8h12"/></svg>Customize</a>
    </nav>

    <div class="recents">
      <span>Recents</span>
      <span>
        <button aria-label="Search"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg></button>
        <button aria-label="Filter"><svg viewBox="0 0 16 16" fill="none"><path d="M5 2v12M11 2v12M3 10h4M9 6h4"/></svg></button>
      </span>
    </div>
    <div class="list">
      <a title="No conversations yet">Nothing yet — run Keel locally</a>
      <a title="No conversations yet">this is a blank slate</a>
    </div>

    <div class="acct">
      <svg class="logo" viewBox="0 0 48 48"><use href="#starburst"/></svg>
      <b>You</b><small> local</small>
      <svg viewBox="0 0 16 16" fill="none"><path d="M4 6.5l4 4 4-4"/></svg>
    </div>
  </aside>

  <div class="win">
    <button aria-label="Minimize"><svg viewBox="0 0 13 13" fill="none"><path d="M1.5 6.5h10"/></svg></button>
    <button aria-label="Restore"><svg viewBox="0 0 13 13" fill="none"><rect x="1.5" y="3.5" width="8" height="8" rx="1.2"/><path d="M3.8 3.5V2.7a1.2 1.2 0 0 1 1.2-1.2h5.3a1.2 1.2 0 0 1 1.2 1.2V8a1.2 1.2 0 0 1-1.2 1.2h-.8"/></svg></button>
    <button aria-label="Close"><svg viewBox="0 0 13 13" fill="none"><path d="M2 2l9 9M11 2l-9 9"/></svg></button>
  </div>

  <main>
    <h1><svg class="starburst" viewBox="0 0 48 48"><use href="#starburst"/></svg><span class="wordmark">You’re here.</span></h1>
    <p class="subtitle">Keel Desktop · your agents, your files, your machine</p>

    <div class="composer">
      <div class="box">
        <textarea id="t" placeholder="How can I help you today?" aria-label="Message Keel"></textarea>
        <div class="row">
          <button class="add" aria-label="Attach"><svg viewBox="0 0 16 16" fill="none"><path d="M8 2.5v11M2.5 8h11"/></svg></button>
          <button class="model">Keel · local</button>
          <button class="send" id="s" aria-label="Send"><svg viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg></button>
        </div>
      </div>
      <button class="folder"><svg viewBox="0 0 16 16" fill="none"><path d="M2.5 6.5h11v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1zM4 4.5h8M5 2.5h6"/></svg>Point Keel at a folder on your machine</button>
    </div>

    <section class="ideas">
      <p>Ideas for you</p>
      <button class="idea" data-prompt="Send me my daily briefing — who did what, what needs attention today."><span class="ic"><svg viewBox="0 0 16 16" fill="none"><path d="M3 3.5h10v9H3zM5.5 8.8h5M6.5 6.2a1.5 1.5 0 0 1 3 0"/></svg></span><span class="t">Send me a daily briefing</span></button>
      <button class="idea" data-prompt="Review my open tasks and the state of my projects. What needs attention today?"><span class="ic"><svg viewBox="0 0 24 16" fill="none" style="width:28px;height:18px"><path d="M4 4h11l2 2v6H4zM7 4V2.5h10M3 12h18"/></svg></span><span class="t">Review my fleet</span></button>
      <button class="idea" data-prompt="Audit my agents and notes. Is anything misconfigured or out of date?"><span class="ic"><svg viewBox="0 0 16 16" fill="none"><path d="M3.5 2.5h9v11h-9zM5.5 5.5h5M5.5 8h5M5.5 10.5h2.5"/></svg></span><span class="t">Customize Keel for me</span></button>
    </section>
  </main>
</div>

<script>
/* Public mirror: clicking does something honest. Every path explains where
   the real app runs. No data leaves the browser. No calls home. */
(function () {
  const t = document.getElementById('t');
  const s = document.getElementById('s');
  const ideaButtons = document.querySelectorAll('.idea');
  const folderButton = document.querySelector('.folder');
  const runPlaceholder = (prompt) => {
    t.value = prompt;
    t.focus();
    t.setSelectionRange(prompt.length, prompt.length);
  };
  ideaButtons.forEach(b => b.addEventListener('click', () => runPlaceholder(b.dataset.prompt)));
  folderButton.addEventListener('click', () =>
    runPlaceholder('Open a project from my machine and tell me what we are working on. What should I do next?'));
  s.addEventListener('click', () => {
    if (!t.value.trim()) {
      t.focus();
      return;
    }
    t.blur();
    alert('Keel runs locally — clone github.com/eliosmernica15/keel, then `python -m keel serve` and open the printed URL. Your keys stay on your machine.');
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {
      /* offline shell is a nicety, never a hard failure */
    });
  }
})();
</script>
</body>
</html>
