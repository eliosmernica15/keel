    <rect x="40" y="130" width="12" height="12" rx="2" fill="none" stroke="#b9b5ac" stroke-width="2"/>
    <text x="62" y="140" fill="#6b6a66">Files</text>
    <rect x="40" y="172" width="12" height="12" rx="2" fill="none" stroke="#b9b5ac" stroke-width="2"/>
    <text x="62" y="182" fill="#6b6a66">Browser</text>
    <path d="M40 222h12M46 216v12" stroke="#b9b5ac" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="224" fill="#6b6a66">Plugins</text>
    <path d="M40 264h12M46 258v12" stroke="#b9b5ac" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="266" fill="#6b6a66">Schedule</text>
    <rect x="26" y="386" width="132" height="44" rx="8" fill="#faf9f5"/>
    <circle cx="46" cy="408" r="11" fill="#d97757"/>
