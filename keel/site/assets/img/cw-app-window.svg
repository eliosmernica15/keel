<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="cw-app-title cw-app-desc">
  <title id="cw-app-title">KEEL Cowork app window</title>
  <desc id="cw-app-desc">A task sidebar, a running task with steps, and a generated deck preview.</desc>
  <rect width="720" height="470" rx="22" fill="#f1efe8"/>
  <rect x="18" y="24" width="686" height="428" rx="16" fill="#e2ded4"/>
