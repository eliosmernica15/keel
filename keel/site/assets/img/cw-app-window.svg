    <rect x="196" y="136" width="486" height="5" rx="2.5" fill="#ece9e2"/>
    <rect x="196" y="136" width="300" height="5" rx="2.5" fill="#d97757"/>

    <text x="196" y="178" font-size="11" font-weight="700" fill="#9a968d">STEPS</text>
    <g>
      <circle cx="205" cy="204" r="10" fill="#e8f0e6"/><path d="m200 204 3.5 3.5 6-7" fill="none" stroke="#6f9b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
