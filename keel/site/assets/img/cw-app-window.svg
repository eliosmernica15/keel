  <path d="M14 406h692" stroke="#dedcd6"/>
  <circle cx="36" cy="422" r="4" fill="#d97757"/>
  <text x="50" y="426" font-family="Arial, sans-serif" font-size="11" fill="#6b6a66">Working in Cowork — you can close this window</text>
  <text x="690" y="426" text-anchor="end" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#b9b5ac">KEEL</text>
