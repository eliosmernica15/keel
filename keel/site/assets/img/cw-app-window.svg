    <rect x="464" y="204" width="92" height="8" rx="4" fill="#1b1b1b"/>
    <rect x="464" y="220" width="68" height="5" rx="2.5" fill="#dedad1"/>
    <g fill="#e6d9c9"><rect x="464" y="272" width="18" height="34" rx="3"/><rect x="490" y="258" width="18" height="48" rx="3"/><rect x="542" y="264" width="18" height="42" rx="3"/></g>
    <rect x="516" y="244" width="18" height="62" rx="3" fill="#d97757"/>
    <path d="M464 306h200" stroke="#ece9e2"/>
    <rect x="464" y="314" width="42" height="5" rx="2.5" fill="#d97757"/>
