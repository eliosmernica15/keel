      <circle cx="205" cy="244" r="10" fill="#e8f0e6"/><path d="m200 244 3.5 3.5 6-7" fill="none" stroke="#6f9b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="226" y="248" font-size="12" fill="#6b6a66">Pull Amplitude data</text>
