<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="pa-hero-title">
  <title id="pa-hero-title">An open hand supporting a stack of model blocks</title>
  <defs>
    <g id="pa-cube">
      <path d="M0 -29 L50 0 L0 29 L-50 0 Z" fill="#ffffff" stroke="#191919" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M-50 0 L0 29 L0 81 L-50 52 Z" fill="#f1efe8" stroke="#191919" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M50 0 L0 29 L0 81 L50 52 Z" fill="#f7f6f2" stroke="#191919" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <filter id="pa-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.6" result="pa-blur"/>
      <feMerge><feMergeNode in="pa-blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- faint architectural construction lines -->
  <g fill="none" stroke="#dedcd6" stroke-width="1" stroke-dasharray="3 6">
    <path d="M324 60V452M138 152h372M168 360h304"/>
  </g>
  <g fill="none" stroke="#191919" stroke-width="1" opacity=".55">
    <path d="M104 152h18M104 360h18M97 152v208M92 152h10M92 360h10"/>
  </g>

  <!-- stack of five isometric blocks -->
  <use href="#pa-cube" transform="translate(320 360)"/>
  <use href="#pa-cube" transform="translate(312 308)"/>
  <use href="#pa-cube" transform="translate(326 256)"/>
  <use href="#pa-cube" transform="translate(318 204)"/>
  <use href="#pa-cube" transform="translate(324 152)"/>

  <!-- terracotta glowing edges -->
  <g fill="none" stroke="#d97757" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pa-glow)">
    <path d="M374 152 L324 181 L274 152"/>
    <path d="M376 256 L326 285 L326 337"/>
    <path d="M262 360 L312 389 L362 360"/>
  </g>
  <g fill="none" stroke="#a94e32" stroke-width="1" stroke-linecap="round" opacity=".85">
    <path d="M374 152 L324 181 L274 152"/>
  </g>

  <!-- small sparks -->
  <g fill="#d97757">
    <circle cx="392" cy="118" r="2.6"/><circle cx="240" cy="140" r="2"/>
    <circle cx="404" cy="204" r="1.8"/><circle cx="228" cy="232" r="2.4"/>
  </g>
  <g fill="none" stroke="#d97757" stroke-width="1.6" stroke-linecap="round">
    <path d="M400 96v10M395 101h10M214 210v8M210 214h8"/>
  </g>

  <!-- open hand, palm up -->
  <g fill="#f7f6f2" stroke="#191919" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M190 470 C 214 452 248 446 282 450 C 306 453 324 462 336 474 C 344 482 342 492 332 496 C 306 506 268 504 238 496 C 214 490 194 482 190 470 Z"/>
    <path d="M320 462 C 348 450 388 442 428 440 C 442 439 450 444 450 451 C 450 458 442 463 428 465 L 348 478 Z"/>
    <path d="M326 476 C 356 466 394 460 430 460 C 442 460 448 465 448 471 C 448 477 442 482 430 483 L 352 492 Z"/>
    <path d="M324 488 C 352 480 384 476 414 476 C 426 476 432 480 432 486 C 432 492 426 496 414 497 L 346 504 Z"/>
    <path d="M310 498 C 334 492 360 490 382 492 C 392 493 397 497 396 502 C 395 507 389 510 380 510 L 330 512 Z"/>
    <path d="M196 468 C 178 458 156 454 138 458 C 128 460 124 467 128 473 C 132 479 142 481 154 480 L 190 480 Z"/>
  </g>
  <g fill="none" stroke="#191919" stroke-width="2" stroke-linecap="round">
    <path d="M46 520 C 96 506 142 486 190 470"/>
    <path d="M120 520 C 156 506 186 492 222 488 C 248 485 270 488 288 496"/>
  </g>
  <path d="M214 466 C 236 460 262 460 284 466" fill="none" stroke="#d97757" stroke-width="2" stroke-linecap="round" opacity=".9"/>
</svg>
