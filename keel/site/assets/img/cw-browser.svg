<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="cw-browser-title cw-browser-desc">
  <title id="cw-browser-title">Built-in browser in the Cowork side panel</title>
  <desc id="cw-browser-desc">KEEL keeps working in the main window while a separate browser panel handles a web task.</desc>
  <rect width="560" height="360" rx="18" fill="#f1efe8"/>
  <rect x="14" y="14" width="532" height="332" rx="12" fill="#ffffff" stroke="#dedcd6"/>
  <path d="M14 52h532M350 52v294" stroke="#e8e5de"/>
