  <text x="182" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6b6a66">KEEL Cowork</text>

  <g font-family="Arial, sans-serif">
    <text x="34" y="84" font-size="14" font-weight="700" fill="#1b1b1b">Drafting weekly readout</text>
    <text x="34" y="106" font-size="11" fill="#9a968d">Task running in the background</text>
    <rect x="34" y="124" width="292" height="164" rx="9" fill="#faf9f5" stroke="#ece9e2"/>
    <rect x="50" y="142" width="120" height="8" rx="4" fill="#1b1b1b"/>
    <rect x="50" y="162" width="248" height="6" rx="3" fill="#dedad1"/>
    <rect x="50" y="178" width="226" height="6" rx="3" fill="#dedad1"/>
    <rect x="50" y="194" width="240" height="6" rx="3" fill="#dedad1"/>
    <rect x="50" y="210" width="180" height="6" rx="3" fill="#dedad1"/>
    <g fill="#e6d9c9"><rect x="50" y="234" width="24" height="34" rx="3"/><rect x="82" y="222" width="24" height="46" rx="3"/><rect x="114" y="242" width="24" height="26" rx="3"/><rect x="146" y="214" width="24" height="54" rx="3"/></g>
    <rect x="178" y="226" width="24" height="42" rx="3" fill="#d97757"/>
    <circle cx="34" cy="316" r="4" fill="#d97757"/>
    <text x="48" y="320" font-size="11" fill="#6b6a66">Writing deck…</text>
  </g>

  <rect x="350" y="52" width="196" height="294" rx="0" fill="#faf9f5"/>
  <g font-family="Arial, sans-serif">
    <circle cx="374" cy="78" r="8" fill="none" stroke="#d97757" stroke-width="2"/>
    <path d="M366 78h16M374 70c4 4 4 12 0 16M374 70c-4 4-4 12 0 16" stroke="#d97757" stroke-width="1.6"/>
    <text x="390" y="83" font-size="12" font-weight="700" fill="#1b1b1b">Browser</text>
    <rect x="366" y="98" width="164" height="26" rx="7" fill="#ffffff" stroke="#dedcd6"/>
    <circle cx="379" cy="111" r="3" fill="none" stroke="#d97757" stroke-width="1.5"/>
    <text x="389" y="115" font-size="10" fill="#6b6a66">app.example.com/report</text>
    <rect x="366" y="138" width="164" height="190" rx="9" fill="#ffffff" stroke="#e0dcd3"/>
    <rect x="382" y="156" width="84" height="7" rx="3.5" fill="#1b1b1b"/>
    <rect x="382" y="174" width="132" height="22" rx="5" fill="#faf9f5" stroke="#dedad1"/>
    <rect x="382" y="204" width="132" height="22" rx="5" fill="#faf9f5" stroke="#dedad1"/>
    <rect x="382" y="236" width="60" height="7" rx="3.5" fill="#dedad1"/>
    <rect x="382" y="252" width="132" height="22" rx="5" fill="#faf9f5" stroke="#dedad1"/>
    <rect x="382" y="286" width="72" height="24" rx="6" fill="#d97757"/>
    <text x="397" y="302" font-size="10" font-weight="700" fill="#ffffff">Submit</text>
    <text x="366" y="344" font-size="10" fill="#9a968d">Separate from your browser</text>
