<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t">
  <title id="t">Getting started terminal prompt illustration</title>
  <rect width="800" height="500" fill="#edb49e"/>
  <rect x="10" y="10" width="780" height="480" rx="28" fill="none" stroke="#191919" stroke-width="2"/>

  <!-- terminal window -->
  <rect x="110" y="92" width="580" height="316" rx="18" fill="#141413" stroke="#191919" stroke-width="3"/>
  <path d="M110 142 H690" stroke="#3a3a37" stroke-width="2"/>
  <circle cx="144" cy="117" r="7" fill="#f0c4a8"/>
  <circle cx="168" cy="117" r="7" fill="#f0c4a8" opacity="0.6"/>
  <circle cx="192" cy="117" r="7" fill="#f0c4a8" opacity="0.3"/>
  <rect x="560" y="108" width="104" height="18" rx="5" fill="#e6d54c"/>

  <!-- prompt -->
  <path d="M152 194 L176 210 L152 226" fill="none" stroke="#e6d54c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="196" y="202" width="180" height="14" rx="4" fill="#f7f6f2" opacity="0.85"/>
  <rect x="152" y="252" width="250" height="10" rx="4" fill="#f7f6f2" opacity="0.4"/>
  <rect x="152" y="276" width="200" height="10" rx="4" fill="#f7f6f2" opacity="0.4"/>
  <rect x="152" y="300" width="290" height="10" rx="4" fill="#f7f6f2" opacity="0.4"/>

  <!-- second prompt with yellow cursor -->
  <path d="M152 350 L176 366 L152 382" fill="none" stroke="#e6d54c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="196" y="358" width="120" height="14" rx="4" fill="#f7f6f2" opacity="0.85"/>
  <rect x="326" y="354" width="12" height="22" rx="2" fill="#e6d54c"/>

  <!-- spark accents -->
  <g fill="#e6d54c" stroke="#191919" stroke-width="2">
    <path d="M700 74 l6 -14 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 Z"/>
  </g>
  <circle cx="96" cy="404" r="8" fill="#e6d54c" stroke="#191919" stroke-width="2"/>
  <circle cx="712" cy="418" r="6" fill="#191919"/>
</svg>
