<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Keel — terminal illustration with keel and boat motif</title>
  <rect x="8" y="8" width="384" height="384" rx="40" fill="#f0c4a8"/>
  <rect x="8" y="8" width="384" height="384" rx="40" fill="none" stroke="#191919" stroke-width="2"/>

  <!-- terminal window -->
  <rect x="62" y="72" width="276" height="208" rx="14" fill="#f7f6f2" stroke="#191919" stroke-width="3"/>
  <path d="M62 106 H338" stroke="#191919" stroke-width="3"/>
  <circle cx="86" cy="89" r="6" fill="#191919"/>
  <circle cx="108" cy="89" r="6" fill="#191919"/>
  <circle cx="130" cy="89" r="6" fill="#191919"/>
  <rect x="258" y="82" width="58" height="14" rx="7" fill="#e6d54c" stroke="#191919" stroke-width="2"/>

  <!-- transcript lines -->
  <g stroke="#191919" stroke-width="4" stroke-linecap="round">
    <path d="M86 138 H168"/>
    <path d="M86 158 H226"/>
    <path d="M86 178 H140"/>
    <path d="M86 198 H196"/>
    <path d="M86 218 H158"/>
  </g>
  <g fill="#6b6b6b">
    <rect x="86" y="132" width="26" height="9" rx="4"/>
    <rect x="86" y="152" width="26" height="9" rx="4"/>
    <rect x="86" y="172" width="26" height="9" rx="4"/>
    <rect x="86" y="192" width="26" height="9" rx="4"/>
    <rect x="86" y="212" width="26" height="9" rx="4"/>
  </g>
  <rect x="86" y="234" width="12" height="16" rx="2" fill="#e6d54c" stroke="#191919" stroke-width="2"/>

  <!-- boat / keel motif -->
  <g transform="translate(200 252)" fill="none" stroke="#191919" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-44 14 H44 L30 34 H-30 Z" fill="#f7f6f2"/>
    <path d="M0 12 V-38"/>
    <path d="M0 -34 L26 -6 H0 Z" fill="#e6d54c"/>
    <path d="M-44 14 Q0 44 44 14"/>
  </g>

  <!-- yellow sparks -->
  <g stroke="#191919" stroke-width="2" stroke-linecap="round">
    <path d="M340 60 l0 16 M332 68 l16 0" fill="none"/>
    <path d="M56 300 l0 12 M50 306 l12 0" fill="none"/>
    <path d="M344 296 l0 10 M339 301 l10 0" fill="none"/>
  </g>
  <g fill="#e6d54c" stroke="#191919" stroke-width="2">
    <circle cx="340" cy="68" r="7"/>
    <circle cx="56" cy="306" r="6"/>
    <circle cx="344" cy="301" r="5"/>
    <path d="M300 336 l6 -12 l6 12 l12 6 l-12 6 l-6 12 l-6 -12 l-12 -6 Z"/>
  </g>
</svg>
