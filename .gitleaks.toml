title = "Keel gitleaks configuration (M1)"

[extend]
useDefault = true

# The repository has historically contained black-box captures of a third-party
# product and early site code. Those findings were reviewed during M1: all are
# `generic-api-key` matches in captured example streams or demo UI strings, not
# Keel credentials. Allowlist only the reviewed paths and commits; every new
# file and every new commit is still scanned by the default rule set.
[allowlist]
description = "Reviewed third-party reference captures and historical demo strings"
paths = [
  '''agent-reference-shots/.*''',
  '''claude-code-evidence\.md''',
  '''agent-evidence.*\.md''',
  '''prompt-pattern-analysis\.md''',
]
