title = "Keel gitleaks configuration (M1 closeout)"

[extend]
useDefault = true

# M1 review classified 66 historical findings as false positives. They are all
# rule `generic-api-key` matches inside black-box reference captures or deleted
# demo site strings. Each exception below is scoped to ONE commit AND ONE exact
# path: a finding elsewhere in the same commit is still reported. No global
# commit-wide or repo-wide allowlist remains, and no secret value is recorded.
#
# Re-review every entry before removing it. If a path is deleted from history
# (G2, owner approval required), remove the corresponding block.

