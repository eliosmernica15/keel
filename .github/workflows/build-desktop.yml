name: Build desktop installers

# Builds Keel Desktop for Windows, macOS and Linux in CI.
# Keel lives in the `keel/` directory of this repository, so every build
# step that needs the project runs with working-directory: keel.
#
# Guarantees:
# - Version sync is asserted before any build job runs (fail fast).
# - electron-builder never publishes (`--publish never`); GH_TOKEN is not
#   provided to the packaging steps. GitHub Releases are never used.
# - Every platform artifact (Windows exe, macOS dmg+zip, Linux AppImage+deb)
#   must exist before a tag release can proceed.
# - `prepare-installers` stages a FLAT directory; the old pipeline uploaded
#   from nested artifact folders and silently skipped every installer.
# - `upload-to-hosting` (tags only, gated on R2_UPLOAD_ENABLED) uploads to
#   Keel-controlled R2, then *downloads every public object over HTTPS* and
#   compares status, byte count and SHA-256 before publishing a manifest.
# - The public download.json is published last, after verification, and is
#   re-fetched and compared so the site only sees a verified release.
# - A missing secret, missing public base URL, failed upload, missing file or
#   checksum mismatch fails the job.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Latest push wins; tag builds always run to completion (uploads matter).
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check version sync
        working-directory: keel
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            python scripts/check_version_sync.py --tag "${GITHUB_REF#refs/tags/}"
          else
            python scripts/check_version_sync.py
          fi

  build-windows:
    needs: validate-versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build keel sidecar (PyInstaller)
        shell: powershell
        working-directory: keel
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller pillow
          python desktop-app\scripts\generate_assets.py
          python -m PyInstaller desktop-app\sidecar.spec --noconfirm --distpath dist\keel-sidecar
          New-Item -ItemType Directory -Force -Path build\resources\keel | Out-Null
          Copy-Item dist\keel-sidecar\keel.exe build\resources\keel\keel.exe
      - name: npm install
        working-directory: keel/desktop-app
        run: npm install --no-audit --no-fund
      - name: Build NSIS installer (never publishes)
        working-directory: keel/desktop-app
        run: npx electron-builder --win --publish never
      - name: SHA-256
        shell: bash
        working-directory: keel
        run: sha256sum dist/Keel-Setup-*.exe > dist/SHA256SUMS-windows.txt && cat dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: keel-windows
          retention-days: 30
          if-no-files-found: error
          path: |
            keel/dist/Keel-Setup-*.exe
            keel/dist/SHA256SUMS-windows.txt

  build-macos:
    needs: validate-versions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build keel sidecar (PyInstaller)
        working-directory: keel
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller pillow
          python desktop-app/scripts/generate_assets.py
          python -m PyInstaller desktop-app/sidecar.spec --noconfirm --distpath dist/keel-sidecar
          mkdir -p build/resources/keel
          cp dist/keel-sidecar/keel build/resources/keel/keel
      - name: npm install
        working-directory: keel/desktop-app
        run: npm install --no-audit --no-fund
      - name: Build .dmg + .zip (never publishes)
        working-directory: keel/desktop-app
        run: npx electron-builder --mac --publish never
      - name: SHA-256
        working-directory: keel
        run: shasum -a 256 dist/Keel-*-macos-*.dmg dist/Keel-*-macos-*.zip > dist/SHA256SUMS-macos.txt && cat dist/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v7
        with:
          name: keel-macos
          retention-days: 30
          if-no-files-found: error
          path: |
            keel/dist/Keel-*-macos-*.dmg
            keel/dist/Keel-*-macos-*.zip
            keel/dist/SHA256SUMS-macos.txt

  build-linux:
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: System deps for electron-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools desktop-file-utils rpm
      - name: Build keel sidecar (PyInstaller)
        working-directory: keel
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller pillow
          python desktop-app/scripts/generate_assets.py
          python -m PyInstaller desktop-app/sidecar.spec --noconfirm --distpath dist/keel-sidecar
          mkdir -p build/resources/keel
          cp dist/keel-sidecar/keel build/resources/keel/keel
      - name: npm install
        working-directory: keel/desktop-app
        run: npm install --no-audit --no-fund
      - name: Build .AppImage + .deb (never publishes)
        working-directory: keel/desktop-app
        run: npx electron-builder --linux AppImage deb --publish never
      - name: SHA-256
        working-directory: keel
        run: sha256sum dist/Keel-*-linux-*.AppImage dist/Keel-*-linux-*.deb > dist/SHA256SUMS-linux.txt && cat dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: keel-linux
          retention-days: 30
          if-no-files-found: error
          path: |
            keel/dist/Keel-*-linux-*.AppImage
            keel/dist/Keel-*-linux-*.deb
            keel/dist/SHA256SUMS-linux.txt

  # Runs only on tag pushes and only after all three builds succeed.
  prepare-installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Version sync check (tag must match)
        working-directory: keel
        run: python scripts/check_version_sync.py --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Require every platform artifact
        run: |
          set -euo pipefail
          check() {
            if ! find artifacts -type f -name "$1" -print -quit | grep -q .; then
              echo "::error::missing required artifact matching $1"
              exit 1
            fi
          }
          check 'Keel-Setup-*.exe'
          check 'Keel-*-macos-arm64.dmg'
          check 'Keel-*-macos-arm64.zip'
          check 'Keel-*-linux-*.AppImage'
          check 'Keel-*-linux-*.deb'
      - name: Stage a flat release directory
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f \( -name 'Keel-*' -o -name 'SHA256SUMS-*.txt' \) -exec cp {} release/ \;
          ls -l release
      - name: Combined checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          ( cd release && sha256sum Keel-* ) > RELEASE-SHA256SUMS.txt
          cp RELEASE-SHA256SUMS.txt release/
          cat RELEASE-SHA256SUMS.txt
      # URLs are only "pending" when no public base URL is configured; the
      # upload job refuses to run in that state.
      - name: Generate release manifest
        working-directory: keel
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          python scripts/make_release_manifest.py \
            --artifacts ../release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --base-url "${R2_PUBLIC_BASE_URL:-}" \
            --out ../release/RELEASE-MANIFEST.json
          cat ../release/RELEASE-MANIFEST.json
      - uses: actions/upload-artifact@v7
        with:
          name: keel-installers
          retention-days: 90
          if-no-files-found: error
          path: release/**
      - uses: actions/upload-artifact@v7
        with:
          name: keel-release-manifest
          retention-days: 90
          if-no-files-found: error
          path: release/RELEASE-MANIFEST.json

  # Never runs unless both gates are set: a tag build AND repository variable
  # R2_UPLOAD_ENABLED == 'true' (+ secrets configured). Upload is to
  # Keel-controlled R2 only - GitHub Releases are never used. See docs/HOSTING.md.
  upload-to-hosting:
    name: Publish verified installers
    needs: prepare-installers
    if: startsWith(github.ref, 'refs/tags/v') && vars.R2_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: keel-installers
          path: staged
      - name: Stage flat files
        run: |
          set -euo pipefail
          mkdir release
          find staged -type f -exec cp {} release/ \;
          ls -l release
      - name: Require complete R2 configuration
        run: |
          set -euo pipefail
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME R2_PUBLIC_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          case "$R2_PUBLIC_BASE_URL" in
            https://*) ;;
            *) echo "::error::R2_PUBLIC_BASE_URL must be an absolute https:// URL"; exit 1 ;;
          esac
          echo "Public base: $R2_PUBLIC_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli
      - name: Upload versioned installers to R2
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          content_type() {
            case "$1" in
              *.exe) echo application/octet-stream ;;
              *.dmg) echo application/x-apple-diskimage ;;
              *.zip) echo application/zip ;;
              *.AppImage) echo application/octet-stream ;;
              *.deb) echo application/vnd.debian.binary-package ;;
              *.json) echo application/json ;;
              *.txt) echo text/plain ;;
              *) echo application/octet-stream ;;
            esac
          }
          cd release
          for f in *; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://$R2_BUCKET_NAME/$RELEASE_TAG/$f" \
              --region auto --endpoint-url "$endpoint" \
              --content-type "$(content_type "$f")" \
              --cache-control "public, max-age=31536000, immutable"
          done
      - name: Verify public downloads (HTTPS + size + SHA-256)
        run: |
          set -euo pipefail
          python keel/scripts/verify_public_release.py \
            --manifest release/RELEASE-MANIFEST.json \
            --retries 5 --retry-delay 10 --timeout 600
      # The site manifest is generated only after every public object was
      # downloaded and matched. A channel cannot be "available" because it
      # merely compiled.
      - name: Generate public download manifest
        run: |
          set -euo pipefail
          python keel/scripts/make_download_manifest.py \
            --artifacts release \
            --version "${RELEASE_TAG#v}" \
            --tag "$RELEASE_TAG" \
            --base-url "$R2_PUBLIC_BASE_URL" \
            --out release/download.json
          cat release/download.json
      - name: Publish public manifest (root + versioned)
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # Root manifest: short cache so a new release becomes visible
          # without a website deploy.
          aws s3 cp release/download.json "s3://$R2_BUCKET_NAME/download.json" \
            --region auto --endpoint-url "$endpoint" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0, must-revalidate"
          # Versioned copy for immutable records.
          aws s3 cp release/download.json "s3://$R2_BUCKET_NAME/$RELEASE_TAG/download.json" \
            --region auto --endpoint-url "$endpoint" \
            --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"
      - name: Verify published manifest over HTTPS
        run: |
          set -euo pipefail
          url="${R2_PUBLIC_BASE_URL%/}/download.json"
          ok=0
          for i in $(seq 1 10); do
            if curl -fsSL --max-time 60 "$url" -o published-download.json; then
              if python keel/scripts/check_download_manifest.py \
                   release/download.json --compare published-download.json; then
                ok=1
                break
              fi
            fi
            sleep 6
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::published manifest was not readable/matching within the retry window"
            exit 1
          fi
          python keel/scripts/verify_public_release.py \
            --manifest published-download.json \
            --retries 3 --retry-delay 5 --timeout 600
      - name: Release summary
        run: |
          set -euo pipefail
          base="${R2_PUBLIC_BASE_URL%/}/$RELEASE_TAG"
          {
            echo "## Keel $RELEASE_TAG published"
            echo ""
            echo "Manifest: ${R2_PUBLIC_BASE_URL%/}/download.json"
            echo ""
            echo "| File | Public URL |"
            echo "| --- | --- |"
            for f in release/Keel-*; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | $base/$(basename "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
