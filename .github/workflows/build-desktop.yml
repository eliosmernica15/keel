name: Build desktop installers

# Builds Keel Desktop for Windows, macOS and Linux in CI.
# Keel lives in the `keel/` directory of this repository, so every build
# step that needs the project runs with working-directory: keel.
#
# On tag pushes (v*) a combined checksum manifest is staged as the
# `keel-installers` artifact. CI never publishes a GitHub Release and
# never uploads installers anywhere unless the `R2_UPLOAD_ENABLED`
# repository variable is set to `true` (see docs/HOSTING.md) — and even
# then it only ships to Keel-controlled R2 storage via the secrets
# `R2_ACCESS_KEY_ID`, `R2_SECRET_ACCESS_KEY`, `R2_ACCOUNT_ID`, `R2_BUCKET_NAME`.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build keel sidecar (PyInstaller)
        shell: powershell
        working-directory: keel
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller pillow
          python -m PyInstaller desktop-app\sidecar.spec --noconfirm --distpath dist\keel-sidecar
          New-Item -ItemType Directory -Force -Path build\resources\keel | Out-Null
          Copy-Item dist\keel-sidecar\keel.exe build\resources\keel\keel.exe
      - name: Generate installer assets
        working-directory: keel
        run: |
          pip install pillow
          python desktop-app\scripts\generate_assets.py
      - name: npm install
        working-directory: keel/desktop-app
        run: npm install --no-audit --no-fund
      - name: Build NSIS installer
        working-directory: keel/desktop-app
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SHA-256
        shell: bash
        working-directory: keel
        run: sha256sum dist/Keel-Setup-*.exe > dist/SHA256SUMS-windows.txt && cat dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keel-windows
          path: |
            keel/dist/Keel-Setup-*.exe
            keel/dist/SHA256SUMS-windows.txt

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build keel sidecar (PyInstaller)
        working-directory: keel
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller pillow
          python -m PyInstaller desktop-app/sidecar.spec --noconfirm --distpath dist/keel-sidecar
          mkdir -p build/resources/keel
          cp dist/keel-sidecar/keel build/resources/keel/keel
      - name: Generate installer assets (icons)
        working-directory: keel
        run: |
          pip install pillow
          python desktop-app/scripts/generate_assets.py
      - name: npm install
        working-directory: keel/desktop-app
        run: npm install --no-audit --no-fund
      - name: Build .dmg + .zip
        working-directory: keel/desktop-app
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SHA-256
        working-directory: keel
        run: shasum -a 256 dist/Keel-*-macos-*.dmg dist/Keel-*-macos-*.zip > dist/SHA256SUMS-macos.txt && cat dist/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keel-macos
          path: |
            keel/dist/Keel-*-macos-*.dmg
            keel/dist/Keel-*-macos-*.zip
            keel/dist/SHA256SUMS-macos.txt

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System deps for electron-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools desktop-file-utils rpm
      - name: Build keel sidecar (PyInstaller)
        working-directory: keel
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller pillow
          python -m PyInstaller desktop-app/sidecar.spec --noconfirm --distpath dist/keel-sidecar
          mkdir -p build/resources/keel
          cp dist/keel-sidecar/keel build/resources/keel/keel
      - name: Generate installer assets
        working-directory: keel
        run: |
          pip install pillow
          python desktop-app/scripts/generate_assets.py
      - name: npm install
        working-directory: keel/desktop-app
        run: npm install --no-audit --no-fund
      - name: Build .AppImage + .deb
        working-directory: keel/desktop-app
        run: npx electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SHA-256
        working-directory: keel
        run: sha256sum dist/Keel-*-linux-*.AppImage dist/Keel-*-linux-*.deb > dist/SHA256SUMS-linux.txt && cat dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keel-linux
          path: |
            keel/dist/Keel-*-linux-*.AppImage
            keel/dist/Keel-*-linux-*.deb
            keel/dist/SHA256SUMS-linux.txt

  prepare-installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Combined checksum manifest
        shell: bash
        run: |
          find artifacts -type f ! -name 'SHA256SUMS*.txt' -print0 | sort -z | xargs -0 sha256sum > RELEASE-SHA256SUMS.txt
          cat RELEASE-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keel-installers
          path: |
            artifacts/keel-windows/Keel-Setup-*.exe
            artifacts/keel-windows/SHA256SUMS-windows.txt
            artifacts/keel-macos/Keel-*-macos-*.dmg
            artifacts/keel-macos/Keel-*-macos-*.zip
            artifacts/keel-macos/SHA256SUMS-macos.txt
            artifacts/keel-linux/Keel-*-linux-*.AppImage
            artifacts/keel-linux/Keel-*-linux-*.deb
            artifacts/keel-linux/SHA256SUMS-linux.txt
            RELEASE-SHA256SUMS.txt

  # CI never publishes to public GitHub Releases.
  # Installers ship to Keel-controlled R2 storage only, and only when the
  # `R2_UPLOAD_ENABLED` repository variable is `true` and the secrets
  # `R2_ACCESS_KEY_ID`, `R2_SECRET_ACCESS_KEY`, `R2_ACCOUNT_ID`,
  # `R2_BUCKET_NAME` are configured (see docs/HOSTING.md).
  upload-to-hosting:
    needs: prepare-installers
    if: vars.R2_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: keel-installers
      - name: Upload to Keel storage (R2)
        run: |
          sudo apt-get update && sudo apt-get install -y awscli
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto
          aws s3 cp . "s3://$R2_BUCKET_NAME/" --recursive --region auto --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
