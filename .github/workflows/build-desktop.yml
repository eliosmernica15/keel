name: Build desktop installers

# Builds Keel Desktop installers on NATIVE runners:
#   Windows -> Keel-Setup-<version>.exe            (NSIS, per-user, branded)
#   macOS   -> Keel-<version>-macos-{arm64,x64}.pkg (native product archive)
#   Linux   -> Keel-<version>-linux-amd64.deb +
#              Keel-<version>-linux-x86_64.rpm     (native packages)
# Archives (DMG/ZIP/AppImage) are not primary consumer artifacts.
#
# Guarantees:
# - Version sync is asserted before any build job runs (fail fast).
# - The Python release manager owns build, verify, checksum, manifest, publish.
# - electron-builder never publishes (`--publish never`); GH_TOKEN is not
#   provided to the packaging steps. GitHub Releases are created only by the
#   publish job, and only after every installer has been verified.
# - Static packaging/UI acceptance runs on each runner before electron-builder.
# - Each platform has an independent verify-* stage (inventory + native package
#   structure inspection) before the fail-closed signing gate can run.
# - OS code signing / notarization is wired to optional owner secrets and its
#   real status is reported; it is never claimed when absent. Keel's Ed25519
#   release signing is separate and always required for a published tag.
# - download.json is published last, after verification, and is re-fetched and
#   compared so the site only sees a verified release.
# - A missing file, checksum mismatch or unsigned bundle fails the job.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Check version sync
        working-directory: keel
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            python scripts/check_version_sync.py --tag "${GITHUB_REF#refs/tags/}"
          else
            python scripts/check_version_sync.py
          fi

  # Workflow-level release authorization gate. Both the signing gate and the
  # publish job depend on this job, so an unauthorized release cannot publish
  # regardless of how the tag was created. Fails closed (see the called workflow).
  release-authorization:
    name: Release authorization gate (fail closed)
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-authorization.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  build-windows:
    needs: validate-versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Stage owner release signing key (if configured)
        shell: powershell
        env:
          KEEL_RELEASE_SIGNING_KEY: ${{ secrets.KEEL_RELEASE_SIGNING_KEY }}
        run: |
          $key = $env:KEEL_RELEASE_SIGNING_KEY
          if ($key) {
            $path = Join-Path $env:RUNNER_TEMP "keel-release-signing.pem"
            [System.IO.File]::WriteAllText($path, $key + "`n")
            "KEEL_SIGNING_KEY_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Owner release signing key staged outside the artifact tree"
          } else {
            "KEEL_SIGNING_KEY_PATH=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "No owner release signing key configured (builds will be unsigned)"
          }
      - name: Install JS dependencies from lockfile (npm ci)
        shell: bash
        working-directory: keel/desktop-app
        run: |
          set -euo pipefail
          # npm ci enforces package-lock.json integrity hashes; npm install would not.
          npm ci --no-audit --no-fund
          # Fail closed if electron-builder is not the exact lockfile-pinned local binary.
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const pinned = lock.packages["node_modules/electron-builder"].version;
            const installed = JSON.parse(fs.readFileSync("node_modules/electron-builder/package.json", "utf8")).version;
            if (installed !== pinned) {
              console.error(`electron-builder mismatch: installed ${installed}, locked ${pinned}`);
              process.exit(1);
            }
            console.log(`electron-builder pinned from lockfile: ${installed}`);
          '
      - name: Static packaging + UI acceptance checks (Windows)
        shell: powershell
        working-directory: keel
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python desktop-app/scripts/generate_assets.py
          python -m keel.release check-packaging
          node --check desktop-app/main.js
          node desktop-app/scripts/test-ui-root.js
          node desktop-app/scripts/assert-ui-entrypoints.js
      - name: Build installers (Python release manager)
        shell: powershell
        working-directory: keel
        env:
          # npx must resolve the lockfile-installed local binary, never the registry.
          npm_config_offline: "true"
          # Optional OS code signing. Unset => electron-builder skips signing and
          # the status step below reports the installer as unsigned.
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CSC_KEY_PASSWORD }}
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          if ($env:KEEL_SIGNING_KEY_PATH) {
            python -m keel.release build --platform windows --out release --signing-key $env:KEEL_SIGNING_KEY_PATH
          } else {
            python -m keel.release build --platform windows --out release
          }
          python -m keel.release licenses --out release
          $installer = Get-ChildItem dist -Filter "Keel-Setup-*.exe" | Select-Object -First 1
          python -m keel.release check-packaging --installer $installer.FullName --dist dist --platform windows
      - name: Report OS signature status (truthful)
        shell: powershell
        working-directory: keel
        run: |
          $installer = Get-ChildItem dist -Filter "Keel-Setup-*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "WINDOWS_OS_SIGNATURE_STATUS=$($sig.Status)"
          Write-Host "WINDOWS_OS_SIGNER=$($sig.SignerCertificate.Subject)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: keel-windows
          retention-days: 30
          if-no-files-found: error
          path: keel/release/**

  build-macos:
    needs: validate-versions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Stage owner release signing key (if configured)
        env:
          KEEL_RELEASE_SIGNING_KEY: ${{ secrets.KEEL_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${KEEL_RELEASE_SIGNING_KEY:-}" ]; then
            umask 077
            printf '%s\n' "$KEEL_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/keel-release-signing.pem"
            echo "KEEL_SIGNING_KEY_PATH=$RUNNER_TEMP/keel-release-signing.pem" >> "$GITHUB_ENV"
            echo "Owner release signing key staged outside the artifact tree"
          else
            echo "KEEL_SIGNING_KEY_PATH=" >> "$GITHUB_ENV"
            echo "No owner release signing key configured (builds will be unsigned)"
          fi
      - name: Install JS dependencies from lockfile (npm ci)
        shell: bash
        working-directory: keel/desktop-app
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const pinned = lock.packages["node_modules/electron-builder"].version;
            const installed = JSON.parse(fs.readFileSync("node_modules/electron-builder/package.json", "utf8")).version;
            if (installed !== pinned) {
              console.error(`electron-builder mismatch: installed ${installed}, locked ${pinned}`);
              process.exit(1);
            }
            console.log(`electron-builder pinned from lockfile: ${installed}`);
          '
      - name: Static packaging + UI acceptance checks (macOS)
        working-directory: keel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python desktop-app/scripts/generate_assets.py
          python -m keel.release check-packaging
          node --check desktop-app/main.js
          node desktop-app/scripts/test-ui-root.js
          node desktop-app/scripts/assert-ui-entrypoints.js
      - name: Build installers (Python release manager)
        working-directory: keel
        env:
          npm_config_offline: "true"
          # Optional Apple Developer identity + notarization credentials.
          # electron-builder signs/notarizes only when these are configured;
          # the status step below reports the truth either way.
          CSC_LINK: ${{ secrets.MACOS_SIGNING_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_SIGNING_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          if [ -n "${KEEL_SIGNING_KEY_PATH:-}" ]; then
            python -m keel.release build --platform macos --out release --signing-key "$KEEL_SIGNING_KEY_PATH"
          else
            python -m keel.release build --platform macos --out release
          fi
          python -m keel.release licenses --out release
          python -m keel.release check-packaging --dist dist --platform macos
      - name: Report OS signature status (truthful)
        working-directory: keel
        run: |
          set -euo pipefail
          PKG=$(find dist -name "*.pkg" | head -1)
          if [ -z "$PKG" ]; then echo "no .pkg produced"; exit 1; fi
          echo "MACOS_PKG=$PKG"
          pkgutil --check-signature "$PKG" || echo "MACOS_OS_SIGNATURE_STATUS=unsigned or unrecognized"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: keel-macos
          retention-days: 30
          if-no-files-found: error
          path: keel/release/**

  build-linux:
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: System deps for native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev desktop-file-utils rpm libarchive-tools
      - name: Stage owner release signing key (if configured)
        env:
          KEEL_RELEASE_SIGNING_KEY: ${{ secrets.KEEL_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${KEEL_RELEASE_SIGNING_KEY:-}" ]; then
            umask 077
            printf '%s\n' "$KEEL_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/keel-release-signing.pem"
            echo "KEEL_SIGNING_KEY_PATH=$RUNNER_TEMP/keel-release-signing.pem" >> "$GITHUB_ENV"
            echo "Owner release signing key staged outside the artifact tree"
          else
            echo "KEEL_SIGNING_KEY_PATH=" >> "$GITHUB_ENV"
            echo "No owner release signing key configured (builds will be unsigned)"
          fi
      - name: Install JS dependencies from lockfile (npm ci)
        shell: bash
        working-directory: keel/desktop-app
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const pinned = lock.packages["node_modules/electron-builder"].version;
            const installed = JSON.parse(fs.readFileSync("node_modules/electron-builder/package.json", "utf8")).version;
            if (installed !== pinned) {
              console.error(`electron-builder mismatch: installed ${installed}, locked ${pinned}`);
              process.exit(1);
            }
            console.log(`electron-builder pinned from lockfile: ${installed}`);
          '
      - name: Static packaging + UI acceptance checks (Linux)
        working-directory: keel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python desktop-app/scripts/generate_assets.py
          python -m keel.release check-packaging
          node --check desktop-app/main.js
          node desktop-app/scripts/test-ui-root.js
          node desktop-app/scripts/assert-ui-entrypoints.js
      - name: Build packages (Python release manager)
        working-directory: keel
        env:
          npm_config_offline: "true"
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          if [ -n "${KEEL_SIGNING_KEY_PATH:-}" ]; then
            python -m keel.release build --platform linux --out release --signing-key "$KEEL_SIGNING_KEY_PATH"
          else
            python -m keel.release build --platform linux --out release
          fi
          python -m keel.release licenses --out release
          python -m keel.release check-packaging --dist dist --platform linux
          echo "LINUX_OS_SIGNATURE_STATUS=not configured (distro package signing is an owner gate)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: keel-linux
          retention-days: 30
          if-no-files-found: error
          path: keel/release/**

  verify-windows:
    name: Verify Windows installer
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        working-directory: keel
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: keel-windows
          path: artifacts
      - name: Verify inventory, checksums and NSIS metadata
        shell: powershell
        working-directory: keel
        run: |
          python -m keel.release check-packaging --dist ../artifacts --platform windows
          python -m keel.release dry-run --dist ../artifacts --artifacts ../artifacts
          $installer = Get-ChildItem ../artifacts -Recurse -Filter "Keel-Setup-*.exe" | Select-Object -First 1
          python -m keel.release check-packaging --installer $installer.FullName
          $expected = (Get-Content ../artifacts/RELEASE-SHA256SUMS.txt | Where-Object { $_ -match "Keel-Setup-" }).Split()[0]
          $actual = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "installer checksum mismatch" }
          Write-Host "WINDOWS_VERIFY_PASS"

  verify-macos:
    name: Verify macOS PKG
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        working-directory: keel
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: keel-macos
          path: artifacts
      - name: Verify PKG inventory, checksums and distribution payload
        working-directory: keel
        run: |
          set -euo pipefail
          python -m keel.release check-packaging --dist ../artifacts --platform macos
          python -m keel.release dry-run --dist ../artifacts --artifacts ../artifacts
          for pkg in ../artifacts/Keel-*.pkg; do
            test -f "$pkg"
            echo "PKG=$(basename "$pkg")"
            pkgutil --expand "$pkg" /tmp/keel-pkg-expand
            test -f /tmp/keel-pkg-expand/Distribution
            /usr/bin/xmllint --noout /tmp/keel-pkg-expand/Distribution
            rm -rf /tmp/keel-pkg-expand
          done
          echo "MACOS_VERIFY_PASS"

  verify-linux:
    name: Verify Linux native packages
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install Python and package inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev desktop-file-utils rpm
          python -m pip install --require-hashes -r keel/requirements.lock.txt
      - name: Install Keel release manager
        working-directory: keel
        run: python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: keel-linux
          path: artifacts
      - name: Verify DEB/RPM inventory, checksums and desktop entry
        working-directory: keel
        run: |
          set -euo pipefail
          python -m keel.release check-packaging --dist ../artifacts --platform linux
          python -m keel.release dry-run --dist ../artifacts --artifacts ../artifacts
          DEB=$(find ../artifacts -name "*.deb" | head -1)
          RPM=$(find ../artifacts -name "*.rpm" | head -1)
          test -n "$DEB" && test -n "$RPM"
          dpkg-deb -c "$DEB" | grep -q "/usr/share/applications/keel.desktop"
          dpkg-deb -c "$DEB" | grep -q "/usr/share/icons"
          dpkg-deb -f "$DEB" Depends
          rpm -qpl "$RPM" | grep -q "keel.desktop"
          echo "LINUX_VERIFY_PASS"

  verify-release-signatures:
    name: Fail-closed release signing gate
    needs: [verify-windows, verify-macos, verify-linux, release-authorization]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEEL_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.KEEL_RELEASE_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        working-directory: keel
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
      - name: Verify every release bundle is signed (no publishing)
        working-directory: keel
        run: |
          set -euo pipefail
          if [ -z "${KEEL_RELEASE_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "ERROR: KEEL_RELEASE_SIGNING_PUBLIC_KEY secret is not configured" >&2
            echo "RELEASE SIGNING GATE FAILED - refusing unsigned release" >&2
            exit 1
          fi
          umask 077
          public_key="$RUNNER_TEMP/keel-release.pub.pem"
          printf '%s\n' "$KEEL_RELEASE_SIGNING_PUBLIC_KEY" > "$public_key"
          bundles=0
          for bundle in ../artifacts/*/; do
            [ -d "$bundle" ] || continue
            bundles=$((bundles + 1))
            echo "Verifying signed release bundle: $bundle"
            python -m keel.release dry-run \
              --require-signed \
              --public-key "$public_key" \
              --artifacts "$bundle" \
              --dist "$bundle"
          done
          if [ "$bundles" -eq 0 ]; then
            echo "ERROR: no release bundles found to verify" >&2
            exit 1
          fi
          echo "RELEASE SIGNING GATE PASSED - all release bundles verified"

  publish:
    name: Publish verified release (GitHub Releases)
    needs: [verify-windows, verify-macos, verify-linux, verify-release-signatures, release-authorization]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEEL_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.KEEL_RELEASE_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        working-directory: keel
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
      - name: Stage, publish and verify (Python release manager)
        working-directory: keel
        run: |
          set -euo pipefail
          if [ -z "${KEEL_RELEASE_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "ERROR: KEEL_RELEASE_SIGNING_PUBLIC_KEY secret is not configured" >&2
            echo "RELEASE SIGNING GATE FAILED - refusing unsigned release" >&2
            exit 1
          fi
          umask 077
          public_key="$RUNNER_TEMP/keel-release.pub.pem"
          printf '%s\n' "$KEEL_RELEASE_SIGNING_PUBLIC_KEY" > "$public_key"
          python -m keel.release publish \
            --artifacts ../artifacts \
            --tag "$RELEASE_TAG" \
            --out release \
            --require-signed \
            --public-key "$public_key"
          python -m keel.release verify \
            --manifest release/RELEASE-MANIFEST.json \
            --public-key "$public_key" \
            --retries 10 --retry-delay 6 --timeout 600
          python -m keel.release verify \
            --manifest release/download.json \
            --compare "https://github.com/${{ github.repository }}/releases/latest/download/download.json" \
            --retries 10 --retry-delay 6 --timeout 600 \
            --require-available
      - name: Release summary
        run: |
          set -euo pipefail
          {
            echo "## Keel ${RELEASE_TAG} published"
            echo ""
            echo "Manifest: https://github.com/${{ github.repository }}/releases/latest/download/download.json"
            echo ""
            echo "Release: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
