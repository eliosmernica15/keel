name: Python tests

# Runs the Keel pytest suite (with fake transport — no API keys, no network
# dependencies) on all three platforms. Complements build-desktop.yml,
# which packages the installers; this job guards the runtime.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install keel + pytest
        working-directory: keel
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run the suite
        working-directory: keel
        run: python -m pytest -q
        env:
          KEEL_TOKEN: ci-test-token
