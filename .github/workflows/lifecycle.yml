name: Upgrade and rollback lifecycle (Windows)

# Validates upgrade/rollback against the accepted previous release using
# disposable hosted runners. User data is created in the runner's home and must
# survive upgrade, rollback, uninstall and reinstall.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed Build desktop installers run id"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  # Artifact trust gate: lifecycle executes downloaded installers, so it must
  # never consume artifacts from a fork/PR/unverified run. workflow_dispatch is
  # manually triggered but the run_id is caller-supplied; verify the referenced
  # run before any installer is executed. Fails closed.
  trust-gate:
    name: Artifact trust gate (fail closed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Assert run_id is a successful default-branch build of this repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          THIS_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if ! [[ "${RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "BLOCKED: run_id must be numeric" >&2
            exit 1
          fi
          case "${ACTOR}" in
            eliosmernica15) ;;
            *) echo "BLOCKED: actor ${ACTOR} is not an allowlisted owner" >&2; exit 1 ;;
          esac
          meta=$(gh api "repos/${THIS_REPO}/actions/runs/${RUN_ID}" \
            --jq '[.name, .event, .head_repository.full_name, .head_branch, .conclusion] | @tsv')
          IFS=$'\t' read -r run_name run_event run_repo run_branch run_conclusion <<< "$meta"
          echo "run ${RUN_ID}: workflow=${run_name} event=${run_event} repo=${run_repo} branch=${run_branch} conclusion=${run_conclusion}"
          if [ "$run_name" != "Build desktop installers" ] \
             || [ "$run_event" != "push" ] \
             || [ "$run_repo" != "$THIS_REPO" ] \
             || [ "$run_branch" != "$DEFAULT_BRANCH" ] \
             || [ "$run_conclusion" != "success" ]; then
            echo "BLOCKED: run_id does not reference a successful push build of this repo's default branch" >&2
            exit 1
          fi
          echo "TRUSTED: installers from verified run ${RUN_ID}"

  windows-lifecycle:
    needs: trust-gate
    runs-on: windows-latest
    steps:
      - name: Download final Windows artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$env:RUN_ID" --repo "${{ github.repository }}" -n keel-windows -D final-artifact

      - name: Download accepted previous installer (v0.1.1)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v0.1.1 --repo "${{ github.repository }}" --pattern "Keel-Setup-0.1.1.exe" -D previous

      - name: Install previous and create real user data
        shell: powershell
        run: |
          $old = Get-ChildItem previous -Filter "Keel-Setup-*.exe" | Select-Object -First 1
          Start-Process $old.FullName -ArgumentList "/S", "/D=$env:LOCALAPPDATA\KeelLifecycle" -Wait
          $state = Join-Path $env:USERPROFILE ".keel"
          New-Item -ItemType Directory -Force $state | Out-Null
          "lifecycle-marker" | Out-File (Join-Path $state "lifecycle-marker.txt")
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "KeelLifecycle\Keel.exe"))) { throw "previous install failed" }

      - name: Upgrade to final and verify user data
        shell: powershell
        run: |
          $new = Get-ChildItem final-artifact -Recurse -Filter "Keel-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*uninstaller*" } | Select-Object -First 1
          Start-Process $new.FullName -ArgumentList "/S", "/D=$env:LOCALAPPDATA\KeelLifecycle" -Wait
          $marker = Join-Path $env:USERPROFILE ".keel\lifecycle-marker.txt"
          if (-not (Test-Path $marker)) { throw "user data lost during upgrade" }
          $sidecar = Join-Path $env:LOCALAPPDATA "KeelLifecycle\resources\keel\keel.exe"
          & $sidecar --version
          Write-Host "UPGRADE_PASS"

      - name: Rollback and verify data integrity
        shell: powershell
        run: |
          $old = Get-ChildItem previous -Filter "Keel-Setup-*.exe" | Select-Object -First 1
          Start-Process $old.FullName -ArgumentList "/S", "/D=$env:LOCALAPPDATA\KeelLifecycle" -Wait
          $marker = Join-Path $env:USERPROFILE ".keel\lifecycle-marker.txt"
          if ((Get-Content $marker) -ne "lifecycle-marker") { throw "user data corrupted on rollback" }
          Write-Host "ROLLBACK_PASS"

      - name: Uninstall and reinstall final
        shell: powershell
        run: |
          $dest = Join-Path $env:LOCALAPPDATA "KeelLifecycle"
          $un = Get-ChildItem $dest -Filter "unins*.exe" | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList "/S" -Wait }
          Start-Sleep -Seconds 2
          if (-not (Test-Path (Join-Path $env:USERPROFILE ".keel\lifecycle-marker.txt"))) {
            throw "user data removed by uninstall"
          }
          $new = Get-ChildItem final-artifact -Recurse -Filter "Keel-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*uninstaller*" } | Select-Object -First 1
          Start-Process $new.FullName -ArgumentList "/S", "/D=$dest" -Wait
          $sidecar = Join-Path $dest "resources\keel\keel.exe"
          & $sidecar --version
          Write-Host "REINSTALL_PASS"

  macos-lifecycle:
    needs: trust-gate
    runs-on: macos-latest
    steps:
      - name: Download final macOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "${{ github.repository }}" -n keel-macos -D final-artifact
      - name: Download previous release DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v0.1.1 --repo "${{ github.repository }}" --pattern "*.dmg" -D previous
      - name: Install previous, upgrade, rollback, reinstall
        run: |
          set -euo pipefail
          OLD=$(find previous -name '*.dmg' | head -1)
          NEW=$(find final-artifact -name '*.dmg' | head -1)
          test -n "$OLD" && test -n "$NEW"
          hdiutil attach "$OLD" -mountpoint /tmp/keel-old -nobrowse
          cp -R /tmp/keel-old/Keel.app "$HOME/KeelLifecycle.app"
          hdiutil detach /tmp/keel-old
          mkdir -p "$HOME/.keel"
          echo lifecycle-marker > "$HOME/.keel/lifecycle-marker.txt"
          hdiutil attach "$NEW" -mountpoint /tmp/keel-new -nobrowse
          rm -rf "$HOME/KeelLifecycle.app"
          cp -R /tmp/keel-new/Keel.app "$HOME/KeelLifecycle.app"
          hdiutil detach /tmp/keel-new
          test -f "$HOME/.keel/lifecycle-marker.txt"
          "$HOME/KeelLifecycle.app/Contents/Resources/keel/keel" --version
          echo "MACOS_LIFECYCLE_PASS"

  linux-lifecycle:
    needs: trust-gate
    runs-on: ubuntu-latest
    steps:
      - name: Download final Linux artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "${{ github.repository }}" -n keel-linux -D final-artifact
      - name: Download previous release deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v0.1.1 --repo "${{ github.repository }}" --pattern "*.deb" -D previous
      - name: Install previous, create data, upgrade, rollback
        run: |
          set -euo pipefail
          OLD=$(find previous -name '*.deb' | head -1)
          NEW=$(find final-artifact -name '*.deb' | head -1)
          test -n "$OLD" && test -n "$NEW"
          sudo apt-get update -qq
          OLD_ABS=$(realpath "$OLD")
          NEW_ABS=$(realpath "$NEW")
          sudo apt-get install -y -qq "$OLD_ABS" >/dev/null
          mkdir -p "$HOME/.keel"
          echo lifecycle-marker > "$HOME/.keel/lifecycle-marker.txt"
          sudo apt-get install -y -qq --allow-downgrades "$NEW_ABS" >/dev/null
          test -f "$HOME/.keel/lifecycle-marker.txt"
          /usr/bin/keel-desktop --version || true
          sudo apt-get install -y -qq --allow-downgrades "$OLD_ABS" >/dev/null
          test "$(cat "$HOME/.keel/lifecycle-marker.txt")" = lifecycle-marker
          echo "LINUX_LIFECYCLE_PASS"
