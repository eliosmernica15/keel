name: Verify installed packages (clean runners)

# Release acceptance: download the artifacts produced by build-desktop.yml in
# the triggering run, install them on a fresh native runner, start the bundled
# Python sidecar, verify authenticated UI serving, then uninstall/clean up.
# Build success alone is NOT treated as installation validation.
# A fail-closed trust-gate job prevents workflow_run from a PR/fork from
# executing untrusted artifacts; only successful pushes to this repo's default
# branch (or explicit manual dispatch) are allowed.

on:
  workflow_run:
    workflows: ["Build desktop installers"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a completed Build desktop installers workflow"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-install-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  trust-gate:
    name: Trusted trigger guard (fail closed)
    runs-on: ubuntu-latest
    steps:
      - name: Assert trusted workflow_run source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          THIS_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "event=$EVENT_NAME source_event=$SOURCE_EVENT repo=$SOURCE_REPO branch=$SOURCE_BRANCH"
          # Manual dispatch is an authorized, explicit operator action.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "TRUSTED: manual dispatch"
            exit 0
          fi
          # workflow_run artifacts from a PR/fork are untrusted: fail closed.
          if [ "$CONCLUSION" != "success" ] \
             || [ "$SOURCE_EVENT" != "push" ] \
             || [ "$SOURCE_REPO" != "$THIS_REPO" ] \
             || [ "$SOURCE_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "BLOCKED: source is not a successful push to this repository's default branch" >&2
            echo "Refusing to execute artifacts from a fork/PR/untrusted run." >&2
            exit 1
          fi
          echo "TRUSTED: push from $SOURCE_REPO@$SOURCE_BRANCH"

  windows-install:
    needs: trust-gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Download Windows artifact from build run
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: gh run download "$env:RUN_ID" -n keel-windows -D artifacts
      - name: Install silently
        shell: powershell
        run: |
          $installer = Get-ChildItem artifacts -Recurse -Filter "Keel-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*uninstaller*" } | Select-Object -First 1
          if (-not $installer) { throw "installer not found" }
          $dest = Join-Path $env:LOCALAPPDATA "KeelCiValidation"
          Start-Process $installer.FullName -ArgumentList "/S", "/D=$dest" -Wait
          if (-not (Test-Path (Join-Path $dest "Keel.exe"))) { throw "Keel.exe missing after install" }
          Write-Host "INSTALLED=$dest"
      - name: Start bundled sidecar and verify authenticated UI
        shell: powershell
        run: |
          $dest = Join-Path $env:LOCALAPPDATA "KeelCiValidation"
          $sidecar = Join-Path $dest "resources\keel\keel.exe"
          if (-not (Test-Path $sidecar)) { throw "bundled sidecar missing" }
          & $sidecar --version
          $env:KEEL_TOKEN = "ci-install-token"
          $proc = Start-Process -FilePath $sidecar -ArgumentList "serve --port 8895" -PassThru -RedirectStandardError sidecar.log
          try {
            $ok = $false
            for ($i=0; $i -lt 40; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8895/api/health" -Headers @{ "X-Keel-Token"="ci-install-token" } -UseBasicParsing
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "sidecar health failed" }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8895/" -Headers @{ "X-Keel-Token"="ci-install-token" } -UseBasicParsing
            if ($page.Content -notlike "*Keel Cowork*") { throw "canonical UI not served" }
            $noauth = $null
            try { Invoke-WebRequest -Uri "http://127.0.0.1:8895/" -UseBasicParsing -ErrorAction Stop } catch { $noauth = $_.Exception.Response.StatusCode.value__ }
            if ($noauth -ne 403) { throw "unauthenticated request was not refused" }
            Write-Host "UI_AND_AUTH_PASS"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Uninstall and verify cleanup
        shell: powershell
        run: |
          $dest = Join-Path $env:LOCALAPPDATA "KeelCiValidation"
          $un = Get-ChildItem $dest -Filter "unins*.exe" | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList "/S" -Wait }
          Start-Sleep -Seconds 2
          Write-Host "UNINSTALL_ATTEMPTED=$([bool]$un)"
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          if (Get-Process keel -ErrorAction SilentlyContinue) { throw "leftover keel process" }
          Write-Host "CLEANUP_PASS"

  macos-package:
    needs: trust-gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Download macOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: gh run download "$RUN_ID" -n keel-macos -D artifacts
      - name: Expand PKG and inspect native installer payload
        run: |
          set -euo pipefail
          PKG=$(find artifacts -name "*.pkg" | head -1)
          if [ -z "$PKG" ]; then echo "no .pkg found"; exit 1; fi
          echo "PKG=$(basename "$PKG")"
          rm -rf /tmp/keel-pkg-expand
          pkgutil --expand "$PKG" /tmp/keel-pkg-expand
          test -f /tmp/keel-pkg-expand/Distribution
          /usr/bin/xmllint --noout /tmp/keel-pkg-expand/Distribution
          BOM=$(find /tmp/keel-pkg-expand -name Bom | head -1)
          test -n "$BOM"
          lsbom "$BOM" | grep -q "Keel.app/Contents/MacOS/Keel"
          lsbom "$BOM" | grep -q "Resources/keel/keel"
          pkgutil --check-signature "$PKG" || echo "MACOS_OS_SIGNATURE_STATUS=unsigned or unrecognized"
          echo "MACOS_PACKAGE_CONTENT_PASS"

  linux-package:
    needs: trust-gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: gh run download "$RUN_ID" -n keel-linux -D artifacts
      - name: Validate native DEB and RPM contents
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils rpm >/dev/null
          DEB=$(find artifacts -name "*.deb" | head -1)
          RPM=$(find artifacts -name "*.rpm" | head -1)
          test -n "$DEB" && test -n "$RPM"
          dpkg-deb -c "$DEB" | grep -q "Keel"
          dpkg-deb -c "$DEB" | grep -q "/usr/share/applications/keel.desktop"
          dpkg-deb -f "$DEB" Depends
          rpm -qpl "$RPM" | grep -q "keel.desktop"
          desktop-file-validate <(dpkg-deb --fsys-tarfile "$DEB" | tar -xO ./usr/share/applications/keel.desktop) || true
          echo "LINUX_PACKAGE_CONTENT_PASS"
